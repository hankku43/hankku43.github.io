<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>PyTorch View vs Reshape 視覺化</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 800px; width: 100%; }
        h2 { color: #333; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        
        /* Memory Bar Styles */
        .memory-container { margin: 20px 0; }
        .memory-label { font-weight: bold; color: #555; margin-bottom: 5px; }
        .memory-bar { display: flex; gap: 5px; background: #e0e0e0; padding: 10px; border-radius: 8px; flex-wrap: wrap; }
        .block { width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; background: #4a90e2; color: white; font-weight: bold; font-size: 1.2em; border-radius: 4px; position: relative; transition: all 0.5s ease; margin-bottom: 10px; }
        .block-idx { position: absolute; top: -20px; font-size: 0.7em; color: #888; width: 100%; text-align: center; }
        
        /* Tensor Grid Styles */
        .tensor-container { display: grid; gap: 5px; margin-top: 20px; transition: all 0.5s ease; justify-content: center; }
        .tensor-cell { width: 60px; height: 60px; display: flex; align-items: center; justify-content: center; border: 2px solid #4a90e2; color: #4a90e2; font-weight: bold; font-size: 1.2em; border-radius: 8px; background: #f9f9f9; position: relative; }
        
        /* Controls */
        .controls { margin-top: 30px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        button { padding: 10px 20px; font-size: 1em; cursor: pointer; border: none; border-radius: 5px; background: #333; color: white; transition: background 0.2s; }
        button:hover { background: #555; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .btn-view { background: #e74c3c; }
        .btn-reshape { background: #27ae60; }

        .message { margin-top: 15px; padding: 15px; border-radius: 5px; text-align: center; min-height: 50px; font-weight: bold; }
        .msg-info { background: #d1ecf1; color: #0c5460; }
        .msg-error { background: #f8d7da; color: #721c24; }
        .msg-success { background: #d4edda; color: #155724; }

        /* Animation specific */
        .new-memory { background: #27ae60 !important; }
    </style>
</head>
<body>

<div class="container">
    <h2>PyTorch: View vs Reshape 記憶體機制</h2>
    
    <div class="memory-container">
        <div class="memory-label">實體記憶體 (Physical RAM) - 連續排列</div>
        <div class="memory-bar" id="phys-memory">
            </div>
    </div>

    <div style="text-align: center; margin: 20px;">
        <div style="font-size: 2em;">⬇️ 對應 (Mapping) ⬇️</div>
    </div>

    <div class="memory-label">邏輯視圖 (Tensor Logical Shape)</div>
    <div class="tensor-container" id="tensor-grid" style="grid-template-columns: repeat(3, 1fr);">
        </div>

    <div class="message msg-info" id="status-msg">
        狀態：初始張量 (2行, 3欄)。記憶體是連續的 (Contiguous)。
    </div>

    <div class="controls">
        <button onclick="reset()">1. 重置 (Reset)</button>
        <button onclick="doTranspose()">2. 執行 Transpose (轉置)</button>
        <button class="btn-view" onclick="tryView()" id="btn-view" disabled>3. 嘗試 .view(-1)</button>
        <button class="btn-reshape" onclick="doReshape()" id="btn-reshape" disabled>3. 嘗試 .reshape(-1)</button>
    </div>
</div>

<script>
    const data = [1, 2, 3, 4, 5, 6];
    let isTransposed = false;

    // --- 這裡是我之前漏掉的函式！ ---
    function updateMsg(text, type) {
        const msgBox = document.getElementById('status-msg');
        msgBox.innerHTML = text;
        msgBox.className = 'message ' + type;
    }
    // ----------------------------

    function renderMemory(customData = null, isNew = false) {
        const memContainer = document.getElementById('phys-memory');
        memContainer.innerHTML = '';
        const source = customData || data;
        source.forEach((val, idx) => {
            const div = document.createElement('div');
            div.className = isNew ? 'block new-memory' : 'block';
            div.innerHTML = `${val}<span class="block-idx">addr:${idx}</span>`;
            div.id = `mem-${val}`; 
            memContainer.appendChild(div);
        });
    }

    function renderTensor(rows, cols, values) {
        const grid = document.getElementById('tensor-grid');
        grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
        grid.innerHTML = '';
        values.forEach(val => {
            const div = document.createElement('div');
            div.className = 'tensor-cell';
            div.innerText = val;
            grid.appendChild(div);
        });
    }

    function reset() {
        isTransposed = false;
        renderMemory();
        renderTensor(2, 3, [1, 2, 3, 4, 5, 6]);
        updateMsg("狀態：初始張量 (2行, 3欄)。記憶體是連續的 (Contiguous)。", "msg-info");
        document.getElementById('btn-view').disabled = true;
        document.getElementById('btn-reshape').disabled = true;
    }

    function doTranspose() {
        if(isTransposed) return;
        isTransposed = true;
        // 轉置邏輯：原本是 [1,2,3], [4,5,6] -> 變成 [1,4], [2,5], [3,6]
        renderTensor(3, 2, [1, 4, 2, 5, 3, 6]);
        
        updateMsg("狀態：執行了 .t() (轉置)。<br>注意看！上方的「實體記憶體」完全沒動 (1,2,3,4...)！<br>但下方的邏輯順序變了 (1->4->2...)。現在記憶體是 **不連續 (Non-Contiguous)** 的。", "msg-info");
        
        document.getElementById('btn-view').disabled = false;
        document.getElementById('btn-reshape').disabled = false;
    }

    function tryView() {
        updateMsg("❌ 錯誤 (RuntimeError)！<br>.view() 試圖按順序讀取記憶體，但發現邏輯順序 (1,4,2...) 與物理記憶體順序 (1,2,3...) 對不上。<br>PyTorch 會報錯：invalid stride。", "msg-error");
    }

    function doReshape() {
        // Reshape 會創建一個新的記憶體拷貝
        const newData = [1, 4, 2, 5, 3, 6];
        renderMemory(newData, true);
        
        // 並且把它變成一維
        renderTensor(6, 1, newData);
        
        updateMsg("✅ 成功！<br>.reshape() 發現數據不連續，於是創造了**一塊新的記憶體空間** (綠色)，<br>將數據按邏輯順序複製過去。現在這塊新記憶體是連續的了。", "msg-success");
    }

    // 初始化
    reset();
</script>

</body>
</html>
